[project]
name = "wox-stopwatch"
version = "0.1.0"
description = "Stopwatch plugin for Wox v2"
readme = "README.md"
license = "GPL-3.0-only"
authors = [{ name = "lmgarret" }]
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["wox-plugin", "ruff==0.16.8"]

[tool.ruff]
line-length = 180

[tool.ruff.lint]
# Pinned explicitly so a new ruff release can't change what CI enforces.
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]
