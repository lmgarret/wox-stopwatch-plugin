name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
      placeholder: Typing `sw` shows 00:00.0 although the stopwatch was running before I restarted Wox.
    validations:
      required: true
  - type: input
    id: wox-version
    attributes:
      label: Wox version
      placeholder: 2.3.0
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Wox log entries for the Stopwatch plugin, if any.
      render: text
