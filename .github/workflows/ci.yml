name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Lint
        run: make lint

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor and the ceiling of the supported interpreter range.
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          # state.py writes atomically via tempfile + os.replace, whose
          # semantics differ on Windows. macOS behaves like Linux for
          # everything this plugin touches, so it is covered by `make test`
          # during development rather than by a CI job.
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # --frozen, not --locked: release-please bumps the project version in
      # pyproject.toml without regenerating uv.lock, and --locked would reject
      # that drift on every release PR. The lockfile still pins the dev deps.
      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Test
        run: uv run python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package .wox
        run: make package

      - name: Upload plugin package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wox-stopwatch-plugin
          path: "*.wox"
          if-no-files-found: error

  # Single aggregate check, so branch protection depends on one stable context
  # instead of every matrix job name. Adding or dropping a matrix entry no
  # longer means editing the protection rule.
  ci-passed:
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "upstream job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required CI job did not succeed"
              exit 1
            fi
          done
